name: Update IPTV M3U Playlist

on:
  schedule:
    # Chạy tự động sau mỗi 2 tiếng (Định dạng Cron)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép nhấn nút chạy thủ công khi cần

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v3

    - name: Cài đặt Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Cài đặt thư viện phụ thuộc
      run: |
        pip install requests beautifulsoup4

    - name: Chạy script cào dữ liệu
      run: python main.py

    - name: Cam kết và cập nhật file M3U lên GitHub
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "actions@github.com"
        git add live_football.m3u
        git commit -m "Cập nhật lịch bóng đá tự động: $(date)" || exit 0
        git push
